name: Indicator manual UI verification
on:
  push:
    branches:
      - main
      - fix/paper-improvement-20261002
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test dependencies
        run: npm install --ignore-scripts
      - name: Run default regression suite
        run: npm test
      - name: Run public artifact verifier tests
        run: python3 -m unittest -v test_public_release

